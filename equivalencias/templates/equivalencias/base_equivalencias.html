{% extends 'equivalencias/base.html' %}

{% block content %}
<div class="equivalencias-module">
    <!-- Navegación específica del módulo -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light mb-4 rounded">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">
                <i class="bi bi-file-earmark-text"></i> Equivalencias
            </span>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" 
                    data-bs-target="#equivNavbar">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="equivNavbar">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}" 
                           href="{% url 'dashboard' %}">
                            <i class="bi bi-list-ul"></i> Solicitudes
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.resolver_match.url_name == 'pendientes' %}active{% endif %}" 
                           href="{% url 'pendientes' %}">
                            <i class="bi bi-hourglass-split"></i> Pendientes
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.resolver_match.url_name == 'estadisticas' %}active{% endif %}" 
                           href="{% url 'estadisticas' %}">
                            <i class="bi bi-bar-chart"></i> Estadísticas
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Contenido específico de cada página -->
    {% block equiv_content %}
    {% endblock %}
</div>
{% endblock %}
