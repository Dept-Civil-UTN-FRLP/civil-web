{% extends 'equivalencias/base.html' %}

{% block content %}
<div class="carrera-academica-module">
    <!-- Navegación específica del módulo -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light mb-4 rounded">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">
                <i class="bi bi-mortarboard"></i> Carrera Académica
            </span>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" 
                    data-bs-target="#caNavbar">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="caNavbar">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link {% if request.resolver_match.url_name == 'dashboard_ca' %}active{% endif %}" 
                           href="{% url 'carrera_academica:dashboard_ca' %}">
                            <i class="bi bi-grid"></i> Dashboard
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Contenido específico de cada página -->
    {% block ca_content %}
    {% endblock %}
</div>
{% endblock %}
