<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Portal de Jurados{% endblock %} - UTN FRLP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        /* Estilo "carpeta de expediente" compartido por el dashboard y el detalle */
        .folder {
            position: relative;
            background: #f4ecd8;
            border: 1px solid #c9b489;
            border-radius: 2px 10px 10px 10px;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.15);
        }

        .folder-tab {
            position: absolute;
            top: -16px;
            left: 20px;
            background: #c9b489;
            color: #4a3f2a;
            font-size: 8.5pt;
            font-weight: bold;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            padding: 3px 14px;
            border-radius: 4px 4px 0 0;
        }

        .folder-sello {
            display: inline-block;
            border: 2px solid;
            border-radius: 4px;
            padding: 3px 10px;
            font-size: 8.5pt;
            font-weight: bold;
            text-transform: uppercase;
            transform: rotate(-3deg);
        }

        .folder-sello.agendada {
            color: #2b6cb0;
            border-color: #2b6cb0;
        }

        .folder-sello.pendiente {
            color: #a05a2c;
            border-color: #a05a2c;
        }
    </style>
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <span class="navbar-brand mb-0 h1">
                <i class="bi bi-mortarboard"></i> {% block navbar_titulo %}Portal de Jurados{% endblock %} &mdash; UTN FRLP
            </span>
        </div>
    </nav>

    <div class="container pb-5">
        {% if messages %}
        {% for message in messages %}
        <div class="alert alert-{{ message.tags|default:'info' }}">{{ message }}</div>
        {% endfor %}
        {% endif %}

        {% block content %}{% endblock %}
    </div>
</body>
</html>
