{% extends 'digesto/base_digesto.html' %}

{% block digesto_content %}
<div class="d-flex align-items-center gap-3 mb-4">
    <a href="{% url 'digesto:lista_actas' %}" class="btn btn-sm btn-outline-secondary">
        <i class="bi bi-arrow-left"></i>
    </a>
    <h2 class="mb-0"><i class="bi bi-calendar3"></i> {{ titulo }}</h2>
</div>

<div class="card" style="max-width: 400px;">
    <div class="card-body">
        <form method="post" novalidate>
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label fw-semibold">{{ form.anio.label }}</label>
                {{ form.anio }}
                {% if form.anio.errors %}<div class="text-danger small mt-1">{{ form.anio.errors }}</div>{% endif %}
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-check-lg"></i> Crear
                </button>
                <a href="{% url 'digesto:lista_actas' %}" class="btn btn-outline-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
