<!-- Componente de Filtros Reutilizable para Dashboard -->
<div class="card mb-4">
    <div class="card-header">
        <i class="bi bi-funnel"></i> Filtros y Búsqueda
    </div>
    <div class="card-body">
        <form method="GET" class="row g-3">
            <!-- Búsqueda -->
            <div class="col-md-4">
                <label class="form-label">Buscar Docente</label>
                <input type="text" name="q" class="form-control" 
                       placeholder="Nombre, apellido o legajo..." 
                       value="{{ search_query }}">
            </div>

            <!-- Estado -->
            <div class="col-md-2">
                <label class="form-label">Estado</label>
                <select name="estado" class="form-select">
                    <option value="">Todos</option>
                    {% for value, text in estado_choices %}
                    <option value="{{ value }}" {% if value == estado_filter %}selected{% endif %}>
                        {{ text }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <!-- Departamento -->
            <div class="col-md-2">
                <label class="form-label">Departamento</label>
                <select name="departamento" class="form-select">
                    <option value="">Todos</option>
                    {% for value, text in departamento_choices %}
                    <option value="{{ value }}" {% if value == departamento_filter %}selected{% endif %}>
                        {{ text }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <!-- Dedicación -->
            <div class="col-md-2">
                <label class="form-label">Dedicación</label>
                <select name="dedicacion" class="form-select">
                    <option value="">Todas</option>
                    {% for value, text in dedicacion_choices %}
                    <option value="{{ value }}" {% if value == dedicacion_filter %}selected{% endif %}>
                        {{ text }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <!-- Botones -->
            <div class="col-md-2 d-flex align-items-end">
                <button type="submit" class="btn btn-primary me-2">
                    <i class="bi bi-search"></i> Buscar
                </button>
                <a href="{% url 'planta_docente:dashboard' %}" class="btn btn-secondary">
                    <i class="bi bi-x"></i>
                </a>
            </div>
        </form>
    </div>
</div>
