<!-- Badge de estado de vencimiento con tooltip -->
<span class="badge {{ estado_venc.badge_class }}" 
      data-bs-toggle="tooltip" 
      title="{{ estado_venc.mensaje }}">
    {% if estado_venc.tipo == 'vencido' %}
        <i class="bi bi-x-circle"></i> Vencido
    {% elif estado_venc.tipo == 'critico' %}
        <i class="bi bi-exclamation-triangle"></i> {{ estado_venc.dias }}d
    {% elif estado_venc.tipo == 'proximo' %}
        <i class="bi bi-clock"></i> {{ estado_venc.dias }}d
    {% elif estado_venc.tipo == 'vigente' %}
        <i class="bi bi-check-circle"></i> Vigente
    {% else %}
        <i class="bi bi-dash-circle"></i> S/V
    {% endif %}
</span>
