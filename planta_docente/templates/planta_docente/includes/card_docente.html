<!-- Card compacto con información del docente -->
<div class="card mb-3">
    <div class="card-body">
        <div class="d-flex justify-content-between align-items-start">
            <div>
                <h5 class="card-title mb-1">
                    <a href="{% url 'planta_docente:detalle_docente' pk=docente.pk %}" 
                       class="text-decoration-none">
                        {{ docente }}
                    </a>
                </h5>
                <p class="card-text text-muted small mb-2">
                    Legajo: {{ docente.legajo }} | DNI: {{ docente.documento }}
                </p>
            </div>
            <div class="text-end">
                {% include 'planta_docente/includes/badge_jubilacion.html' with estado_jub=docente.estado_jub %}
            </div>
        </div>
        
        {% if correo_principal %}
        <p class="card-text small mb-0">
            <i class="bi bi-envelope"></i> {{ correo_principal.email }}
        </p>
        {% endif %}
    </div>
</div>
